name: build-runpod-image

# Builds voiceforge-api/Dockerfile.runpod and pushes to
# ghcr.io/viqstar/linguamic-tts:runpod so RunPod can pull it.
#
# Triggers:
#   - Manual ("Run workflow" button in the Actions tab) — primary way to
#     rebuild on demand.
#   - Push to main that touches voiceforge-api/** — keeps the registry in
#     sync with code changes automatically.
#
# Notes:
#   - The image bakes in a ~2 GB GGUF model + faster-whisper base, so the
#     final image is ~5-10 GB. Standard GitHub runners have ~14 GB free
#     disk after the runner's own footprint — enough, but tight. If builds
#     start failing on disk, swap to a larger runner or move to a network
#     volume for the model.
#   - Build takes ~20-40 minutes (CUDA compile of llama-cpp-python + model
#     download). Long but predictable.
#   - First push creates a private package under your user. You must
#     flip it to public in GitHub → Your Profile → Packages → linguamic-tts
#     → Package settings, otherwise RunPod can't pull without creds.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'voiceforge-api/**'
      - '.github/workflows/build-runpod-image.yml'

# Only run one build at a time per branch; cancel in-progress builds when a
# newer commit lands so we don't waste 30 minutes building a stale image.
concurrency:
  group: build-runpod-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Free up disk on the runner — the default ubuntu-latest runner has
      # ~14 GB free after the runner image, and our final image needs
      # ~10 GB. Removing preinstalled toolchains we don't use (Android SDK,
      # .NET, Haskell, big browsers) buys back ~25 GB of headroom.
      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags pushed:
      #   - :runpod  — the stable production tag RunPod points at
      #   - :sha-<7> — immutable per-commit tag for rollback
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./voiceforge-api
          file: ./voiceforge-api/Dockerfile.runpod
          push: true
          tags: |
            ghcr.io/viqstar/linguamic-tts:runpod
            ghcr.io/viqstar/linguamic-tts:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**ghcr.io/viqstar/linguamic-tts:runpod**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit-pinned: \`ghcr.io/viqstar/linguamic-tts:sha-${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
