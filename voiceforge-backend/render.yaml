services:
  - type: web
    name: linguamic-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma migrate deploy
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FASTAPI_URL
        sync: false
      - key: FASTAPI_INTERNAL_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      # ── Dodo Payments ─────────────────────────────────────────────────────
      # DODO_ENABLED gates the live integration. When unset/false, the legacy
      # dummy top-up + plan upgrade paths stay active (no real charges).
      - key: DODO_ENABLED
        sync: false
      - key: DODO_API_KEY
        sync: false
      - key: DODO_WEBHOOK_SECRET
        sync: false
      # test_mode | live_mode — defaults to test_mode if unset.
      - key: DODO_ENV
        sync: false
      # FRONTEND_URL is the base used for return_url after checkout.
      - key: DODO_PRODUCT_STARTER
        sync: false
      - key: DODO_PRODUCT_CREATOR
        sync: false
      - key: DODO_PRODUCT_PRO
        sync: false
      - key: DODO_PRODUCT_TOPUP_1
        sync: false
      - key: DODO_PRODUCT_TOPUP_5
        sync: false
      - key: DODO_PRODUCT_TOPUP_10
        sync: false
      # Used as the base URL for Dodo return_url after checkout completes
      # (Dodo redirects the user back to <FRONTEND_URL>/pricing?dodo=success|cancel).
      - key: FRONTEND_URL
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
